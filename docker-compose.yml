# Production stack: Postgres (with pgvector), the web app, and the job worker.
#
#   cp .env.example .env   # then edit DATABASE_URL/AUTH_SECRET/OPENAI_API_KEY
#   docker compose up -d --build
#   docker compose logs -f worker
#
# The web container serves http://localhost:3000. Media is kept in the `media`
# volume when STORAGE_DRIVER=local, so web and worker must share it.

name: looks

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-looks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-looks}
      POSTGRES_DB: ${POSTGRES_DB:-looks}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed for `psql`/`npm run db:migrate` from the host. Drop this if the
      # box is public.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-looks} -d ${POSTGRES_DB:-looks}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MEDIA_DIR: /app/data/media
    ports:
      - "3000:3000"
    volumes:
      - media:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "npm run db:migrate && npm run worker"]
    env_file: .env
    environment:
      MEDIA_DIR: /app/data/media
      # Keeps a Playwright/sharp-heavy worker from taking the box down with it.
      NODE_OPTIONS: --max-old-space-size=1536
    volumes:
      - media:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  pgdata:
  media:
